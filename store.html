<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vaani Store Art</title>
<meta name="robots" content="noindex">
<meta name="description" content="Chrome Web Store screenshots and promo tiles for Vaani, captured from the real app.">
<style>
/* Hallmark · checked form · genre mm · shape: asset page, a column of real captures · surface: system grey paper · posture: restrained · nav: none · footer: none · copy: plain sentence case */
:root{--bg:#F2F2F7;--fg:#1D1D1F;--fg2:#6E6E73;--edge:rgba(60,60,67,0.18);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1C1C1E;--fg:#F5F5F7;--fg2:#A1A1A6;--edge:rgba(84,84,88,0.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1C1C1E;--fg:#F5F5F7;--fg2:#A1A1A6;--edge:rgba(84,84,88,0.6);color-scheme:dark}
html,body{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:32px 16px}
main{max-width:1000px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px;text-wrap:balance}
p{color:var(--fg2);margin:0 0 24px}
figure{margin:0 0 32px}
img{display:block;max-width:100%;height:auto;border-radius:12px;box-shadow:0 0 0 1px var(--edge)}
figcaption{font-size:13px;color:var(--fg2);margin-top:8px}
</style>
</head>
<body>
<main>
<h1>Vaani Chrome Web Store art</h1>
<p>Real captures of the app, taken from the live build with sample data. Right-click an image to save it.</p>
<figure><img src="store/shot-home.png" width="1280" height="800" alt="Vaani Home on a laptop: the record card, then Up next with deadlines on a line"><figcaption>Screenshot 1, 1280×800. Home</figcaption></figure>
<figure><img src="store/shot-note.png" width="1280" height="800" alt="A meeting note with the minute each point was said and tickable action items"><figcaption>Screenshot 2, 1280×800. Notes</figcaption></figure>
<figure><img src="store/shot-todos-dark.png" width="1280" height="800" alt="To-dos from every meeting in dark mode, overdue first"><figcaption>Screenshot 3, 1280×800. To-dos, dark</figcaption></figure>
<figure><img src="store/shot-phone.png" width="1280" height="800" alt="Vaani on a phone: Home with the record button in the tab bar, and a note"><figcaption>Screenshot 4, 1280×800. Phone</figcaption></figure>
<figure><img src="store/tile-small.png" width="440" height="280" alt="The record card from Vaani Home"><figcaption>Small promo tile, 440×280</figcaption></figure>
<figure><img src="store/marquee.png" width="1400" height="560" alt="Vaani Home on a wide screen"><figcaption>Marquee promo tile, 1400×560</figcaption></figure>
</main>
</body>
</html>
