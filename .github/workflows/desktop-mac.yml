# Vaani desktop (macOS): build, unit-test, bundle an UNSIGNED .app, upload it.
#
# Placement: in the vaani repo this file goes to .github/workflows/desktop-mac.yml
# at the REPO ROOT, and the Swift package lives in desktop/ (working-directory
# below). Nothing here pushes, deploys or publishes.
#
# Artifacts: only push and manual runs upload an app. Pull-request runs build
# and test but never upload anything installable (security audit M-03).
# Install only builds from a push to main (or a GitHub Release), never from
# "the latest run".
#
# Optional job "sign-and-notarize" runs only on a push to main or a
# desktop-v* tag, inside the protected GitHub Environment "release"
# (required reviewer: the owner; deployment branches: main and desktop-v*
# tags), and only when ALL of these ENVIRONMENT secrets exist (audit L-07):
#   MACOS_CERTIFICATE_P12      base64 of a "Developer ID Application" .p12
#   MACOS_CERTIFICATE_PASSWORD password of that .p12
#   MACOS_SIGN_IDENTITY        e.g. "Developer ID Application: Name (TEAMID)"
#   NOTARY_API_KEY_P8          base64 of an App Store Connect API key (.p8)
#   NOTARY_KEY_ID              that key's ID
#   NOTARY_ISSUER_ID           the issuer ID
name: Desktop macOS

on:
  push:
    branches: ["**"]
    tags: ["desktop-v*"]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-mac.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-mac.yml"
  workflow_dispatch:
    inputs:
      diagnostic:
        description: "Also build the NO-SANDBOX diagnostic app (Mac testing only, never hand out)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-mac-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash            # gives -eo pipefail, so "| tee" keeps failures
    working-directory: desktop

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Unit tests (VaaniCore, pure Swift; also compiles the app target)
        run: swift test 2>&1 | tee test.log

      - name: Bridge tests (Node; module, shipped user script, CSO probes)
        run: |
          node --test web-bridge/vaani-desktop-bridge.test.mjs
          node --test web-bridge/cso-probe-nonce.test.mjs
          node --test web-bridge/cso-probe-ready-race.test.mjs
          node --test web-bridge/cso-probe-nonce-v3.test.mjs

      - name: Build Vaani.app (release, arm64, App Sandbox on, ad-hoc signed)
        run: bash scripts/build-app.sh 2>&1 | tee build.log

      - name: Build script refuses bad SANDBOX values and signing the diagnostic build
        run: |
          # Each must fail for the RIGHT reason: check the refusal message,
          # not just a nonzero exit.
          for v in yes true 2 on; do
            if OUTPUT="$(SANDBOX="$v" bash scripts/build-app.sh 2>&1)"; then
              echo "::error::SANDBOX=$v was accepted"; exit 1
            fi
            if ! grep -q "SANDBOX must be exactly 1" <<<"$OUTPUT"; then
              echo "::error::SANDBOX=$v failed without the expected refusal message"; echo "$OUTPUT"; exit 1
            fi
          done
          if OUTPUT="$(SANDBOX=0 SIGN_IDENTITY="Developer ID Application: test" bash scripts/build-app.sh 2>&1)"; then
            echo "::error::diagnostic build accepted a signing identity"; exit 1
          fi
          if ! grep -q "Refusing to sign the diagnostic" <<<"$OUTPUT"; then
            echo "::error::diagnostic signing failed without the expected refusal message"; echo "$OUTPUT"; exit 1
          fi

      - name: Build diagnostic variant (manual runs only, sandbox off, Mac testing only)
        if: github.event_name == 'workflow_dispatch' && inputs.diagnostic
        run: |
          SANDBOX=0 bash scripts/build-app.sh 2>&1 | tee build-nosandbox.log
          APP=build-nosandbox/Vaani-DIAGNOSTIC-no-sandbox.app
          test "$(plutil -extract CFBundleIdentifier raw "$APP/Contents/Info.plist")" = "io.github.pradeep411.vaani.desktop.diagnostic"
          test "$(plutil -extract CFBundleDisplayName raw "$APP/Contents/Info.plist")" = "Vaani DIAGNOSTIC"
          test "$(plutil -extract VaaniDiagnosticBuild raw "$APP/Contents/Info.plist")" = "true"

      - name: Fail if any delegate method does not match its protocol
        # A WebKit/AppKit delegate method that only "nearly matches" is never
        # called; for the navigation policy that would be a security hole.
        run: |
          if grep -E "nearly matches (optional )?requirement" test.log build.log build-nosandbox.log 2>/dev/null; then
            echo "::error::A delegate method signature does not match its protocol."
            exit 1
          fi

      - name: Inspect the bundle
        run: |
          plutil -p build/Vaani.app/Contents/Info.plist
          codesign -dv --verbose=2 build/Vaani.app
          codesign -d --entitlements - --xml build/Vaani.app
          test -f build/Vaani.app/Contents/Resources/vaani-userscript.js
          test "$(plutil -extract CFBundleIdentifier raw build/Vaani.app/Contents/Info.plist)" = "io.github.pradeep411.vaani.desktop"
          if plutil -extract VaaniDiagnosticBuild raw build/Vaani.app/Contents/Info.plist >/dev/null 2>&1; then
            echo "::error::normal build carries the diagnostic flag"; exit 1
          fi
          file build/Vaani.app/Contents/MacOS/Vaani | tee /dev/stderr | grep -q arm64
          # The native layer must not contain any network client code.
          if nm -u build/Vaani.app/Contents/MacOS/Vaani | grep -E "URLSession|NSURLConnection|CFNetwork|nw_connection"; then
            echo "::error::Native binary references a network API."
            exit 1
          fi

      - name: Launch smoke test (8 s, no crash on start)
        continue-on-error: true
        run: |
          build/Vaani.app/Contents/MacOS/Vaani &
          PID=$!
          sleep 8
          if kill -0 "$PID" 2>/dev/null; then
            echo "Vaani is running after 8 s"
            kill "$PID"
          else
            wait "$PID" || true
            echo "::warning::Vaani exited during launch on ${{ matrix.os }}"
            exit 1
          fi

      - name: Upload unsigned app (not for pull requests)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Vaani-macOS-unsigned-${{ matrix.os }}
          path: |
            desktop/build/Vaani-macOS-arm64.zip
            desktop/build/Vaani-macOS-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic no-sandbox app (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Vaani-macOS-NOSANDBOX-diagnostic-${{ matrix.os }}
          path: |
            desktop/build-nosandbox/Vaani-macOS-arm64-NOSANDBOX-diagnostic.zip
            desktop/build-nosandbox/Vaani-macOS-arm64-NOSANDBOX-diagnostic.zip.sha256
          if-no-files-found: error
          retention-days: 7

  sign-and-notarize:
    name: Sign and notarize (optional)
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/desktop-v'))
    environment: release
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.MACOS_SIGN_IDENTITY != '' && secrets.NOTARY_API_KEY_P8 != '' && secrets.NOTARY_KEY_ID != '' && secrets.NOTARY_ISSUER_ID != '' }}
    steps:
      - name: Skip when signing secrets are not set
        if: env.HAS_SIGNING != 'true'
        working-directory: .
        run: echo "::notice::Signing secrets are not set, so only the unsigned build was made."

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: env.HAS_SIGNING == 'true'
        with:
          persist-credentials: false

      - name: Import signing certificate into a temporary keychain
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/vaani-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Build and sign with Developer ID (normal sandboxed build only)
        if: env.HAS_SIGNING == 'true'
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          SANDBOX: "1"
        run: |
          bash scripts/build-app.sh
          # Never sign the diagnostic app (re-audit D-01).
          if plutil -extract VaaniDiagnosticBuild raw build/Vaani.app/Contents/Info.plist >/dev/null 2>&1; then
            echo "::error::refusing to sign a diagnostic build"; exit 1
          fi
          test "$(plutil -extract CFBundleIdentifier raw build/Vaani.app/Contents/Info.plist)" = "io.github.pradeep411.vaani.desktop"

      - name: Notarize and staple
        if: env.HAS_SIGNING == 'true'
        env:
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          KEY="$RUNNER_TEMP/notary.p8"
          printf '%s' "$NOTARY_API_KEY_P8" | base64 --decode > "$KEY"
          xcrun notarytool submit build/Vaani-macOS-arm64.zip \
            --key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait --timeout 30m
          rm -f "$KEY"
          xcrun stapler staple build/Vaani.app
          spctl --assess --type execute --verbose=4 build/Vaani.app
          rm -f build/Vaani-macOS-arm64.zip build/Vaani-macOS-arm64.zip.sha256
          ditto -c -k --keepParent build/Vaani.app build/Vaani-macOS-arm64-signed.zip
          shasum -a 256 build/Vaani-macOS-arm64-signed.zip | tee build/Vaani-macOS-arm64-signed.zip.sha256

      - name: Upload signed app
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Vaani-macOS-signed
          path: |
            desktop/build/Vaani-macOS-arm64-signed.zip
            desktop/build/Vaani-macOS-arm64-signed.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary keychain and keys
        if: always() && env.HAS_SIGNING == 'true'
        working-directory: .
        run: |
          security delete-keychain "$RUNNER_TEMP/vaani-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8"
