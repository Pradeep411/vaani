<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vaani</title>
<style>
:root{--bg:#F2F2F7;--card:#fff;--label:#000;--label2:rgba(60,60,67,.6);--sep:rgba(60,60,67,.18);--tint:#0A66D8;--red:#FF3B30;--track:#E9E9EB;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1C1C1E;--label:#fff;--label2:rgba(235,235,245,.6);--sep:rgba(84,84,88,.6);--tint:#3B8BFF;--track:#39393D;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;width:300px;background:var(--bg);color:var(--label);font:400 14px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
.top{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 18px 16px;text-align:center}
.rec{width:64px;height:64px;border-radius:50%;border:0;padding:0;cursor:pointer;background:var(--card);box-shadow:inset 0 0 0 3px var(--track);display:grid;place-items:center;transition:transform .3s cubic-bezier(.32,.72,0,1)}
.rec:hover{transform:scale(1.05)}.rec:active{transform:scale(.95)}
.rec span{width:44px;height:44px;border-radius:50%;background:var(--red)}
h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
p{margin:0;color:var(--label2);font-size:13px}
.card{margin:0 12px 12px;background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px}
.row+.row{border-top:.5px solid var(--sep)}
a.row{color:var(--tint);text-decoration:none}
.sw{position:relative;width:44px;height:26px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--track);transition:background .25s}
.sw i:after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.sw input:checked+i{background:#34C759}.sw input:checked+i:after{transform:translateX(18px)}
.sw input:focus-visible+i{outline:2px solid var(--tint);outline-offset:2px}
</style>
</head>
<body>
<div class="top">
  <button class="rec" id="open" aria-label="Open Vaani"><span></span></button>
  <h1>Vaani meeting notes</h1>
  <p>Tap to open Vaani beside your call.</p>
</div>
<div class="card">
  <label class="row"><span>Ask when a call starts<br><small style="color:var(--label2)">Google Meet, Teams and Zoom in Chrome</small></span><span class="sw"><input type="checkbox" id="ask"><i></i></span></label>
  <a class="row" href="https://github.com/Pradeep411/vaani" target="_blank" rel="noopener">How it works and privacy</a>
</div>
<script src="popup.js"></script>
</body>
</html>
